services:
  - type: web
    name: nba-mvp-model
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/season/2024-25
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
